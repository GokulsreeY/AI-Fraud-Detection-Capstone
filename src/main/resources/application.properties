# =========================================
# APPLICATION
# =========================================
spring.application.name=fraud-detection-api

# =========================================
# SERVER CONFIG
# =========================================
server.port=8080

# =========================================
# LOGGING
# =========================================
logging.level.root=INFO
logging.level.com.example.fraud=DEBUG

# =========================================
# JACKSON JSON CONFIG
# =========================================
spring.jackson.serialization.indent-output=true

# =========================================
# FILE UPLOAD LIMITS (optional)
# =========================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =========================================
# PYTHON SCRIPT CONFIG
# =========================================
fraud.python.script-path=${PYTHON_SCRIPT_PATH:/app/python/predict.py}
fraud.python.model-path=${PYTHON_SCRIPT_PATH:/app/python/fraud_model_v2.pkl}

# =========================================
# ACTUATOR (optional but useful)
# =========================================
management.endpoints.web.exposure.include=health,info

# =========================================s
# DEVTOOLS (optional)
# =========================================
spring.devtools.restart.enabled=true

# =========================================s
# KAFKA CONFIG
# =========================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka.kafka.svc.cluster.local:9092}

spring.kafka.consumer.group-id=fraud-service
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# =========================================s
# DATABASE CONFIG
# =========================================
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
#spring.datasource.url=jdbc:postgresql://localhost:5432/paymentdb
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true