apiVersion: apps/v1
kind: Deployment

metadata:
  name: fraud-service
  namespace: payments

spec:
  replicas: 1

  selector:
    matchLabels:
      app: fraud-service

  template:
    metadata:
      labels:
        app: fraud-service

    spec:
      containers:
        - name: fraud-service
          image: fraud-service:1.3
          imagePullPolicy: Never

          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: payment-config
                  key: DB_HOST

            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: payment-config
                  key: DB_PORT

            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: payment-config
                  key: DB_NAME

            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: payment-secret
                  key: DB_USERNAME

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payment-secret
                  key: DB_PASSWORD

            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka.kafka.svc.cluster.local:9092"

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"